services:
  - type: web
    name: clinicmind-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URLS
        value: https://app.clinicmind.in,https://manage.clinicmind.in,https://admin.clinicmind.in
      - key: AI_SERVICE_URL
        value: https://ai.clinicmind.in
